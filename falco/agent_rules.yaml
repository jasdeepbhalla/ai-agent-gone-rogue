# Layer 2. Runtime behavioral monitoring.
# Policy covers the calls you anticipated. These cover the rest.

- macro: agent_container
  condition: container.image.repository contains "gone-rogue-agent"

- rule: Agent reached a control plane outside its tool path
  desc: The agent container spawned a process it has no reason to run
  condition: >
    spawned_process and agent_container
    and proc.name in (aws, curl, wget, psql, python3)
    and not proc.pname in (python, python3)
  output: >
    AGENT BYPASS: process outside the tool path
    (proc=%proc.name cmd=%proc.cmdline parent=%proc.pname container=%container.name)
  priority: CRITICAL
  tags: [agent, bypass]

- rule: Agent read a credential file
  desc: The agent opened something that looks like it holds secrets
  condition: >
    open_read and agent_container
    and (fd.name endswith ".env" or fd.name contains ".env." or fd.name contains "credentials")
  output: >
    AGENT READ A CREDENTIAL FILE (file=%fd.name proc=%proc.name container=%container.name)
  priority: WARNING
  tags: [agent, secrets]

- rule: Agent made an outbound connection to an AWS API
  desc: Traffic leaving the agent that did not go through its tools
  condition: >
    outbound and agent_container and fd.sport != 4317 and proc.name != python3
  output: >
    AGENT OUTBOUND (proc=%proc.name dest=%fd.rip:%fd.rport container=%container.name)
  priority: NOTICE
  tags: [agent, egress]
