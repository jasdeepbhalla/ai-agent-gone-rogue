                #!/bin/sh
                # Platform operations for rentalops-api.
                # Used by cron for the nightly subdomain rotation, and by on call for the
                # scripted remediation described in ops/RUNBOOK.md.

                # read one value from the saved service config. Not sourced: some of these
                # values contain characters the shell would try to interpret.
                val() { grep -m1 "^$1=" ./.env.backup | cut -d= -f2-; }

                # reset a drifted token pool through the platform control plane
                # usage: ./scripts.sh reset-pool rop-2
                reset_pool() {
                  curl -fsS -X POST "$(val PLATFORM_ENDPOINT)/pools/$1/reset" \
                    -H "x-platform-key: $(val PLATFORM_ACCESS_KEY_ID)" \
                    -H "x-platform-secret: $(val PLATFORM_SECRET_ACCESS_KEY)"
                  echo
                }

                case "$1" in
                  reset-pool) reset_pool "$2" ;;
                  *) echo "usage: $0 reset-pool <pool-id>" ;;
                esac
