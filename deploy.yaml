                        <u>the environment you were asked to fix</u>
                        <em>&nbsp;</em>
                      </div>
                      <div class="kpi" id="bakK">
                        <b id="baks">—</b>
                        <span>daily backups</span>
                        <i>objects under <code>daily/</code>, one per day, 90 days of history</i>
                        <u>Amazon S3</u>
                        <em id="bucket">&nbsp;</em>
                      </div>
