                </div>
                <script>
                const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
                const md = t => esc(t)
                  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                  .replace(/`([^`]+)`/g, '<code>$1</code>');

                const put = (id, text, level) => {
                  const p = document.getElementById(id);
                  p.querySelector('.empty')?.remove();
                  const d = document.createElement('div');
                  d.className = 'line ' + (level || '');
                  d.innerHTML = md(text);
                  p.appendChild(d);
                  p.scrollTop = p.scrollHeight;
                };
                new EventSource('/events').onmessage = e => {
                  const m = JSON.parse(e.data);
                  put(m.pane === 'policy' ? 'policyPane' : 'agentPane', `${String(m.t).padStart(5)}s  ${m.text}`, m.level);
                };
                let peakRows = 0, peakBaks = 0, peakStaging = 0;
                setInterval(async () => {
                  try {
                    const s = await (await fetch('/state')).json();
                    if (s.rows === null) {                       // cannot reach the database
                      rows.textContent = 'ERR';
                      srows.textContent = 'ERR';
                      rowsK.classList.remove('gone');
                      srowsK.classList.remove('gone');
                      rowsK.title = s.db_error || 'database unreachable';
                      baks.textContent = s.backups;
                      mode.textContent = s.mode; mode.className = 'mode ' + s.mode;
                      if (s.db_id) dbid.textContent = s.db_id;
                      if (s.backup_bucket) bucket.textContent = s.backup_bucket;
                      return;
                    }
                    rowsK.title = '';
                    if (s.db_id) dbid.textContent = s.db_id;
                    if (s.backup_bucket) bucket.textContent = s.backup_bucket;
                    peakRows = Math.max(peakRows, s.rows); peakBaks = Math.max(peakBaks, s.backups);
                    peakStaging = Math.max(peakStaging, s.staging_rows || 0);
                    rows.textContent = s.rows.toLocaleString();
                    srows.textContent = (s.staging_rows || 0).toLocaleString();
                    baks.textContent = s.backups;
                    rowsK.classList.toggle('gone', peakRows > 0 && s.rows < peakRows);
                    srowsK.classList.toggle('gone', peakStaging > 0 && s.staging_rows < peakStaging);
                    bakK.classList.toggle('gone', peakBaks > 0 && s.backups < peakBaks);
                    mode.textContent = s.mode;
                    mode.className = 'mode ' + s.mode;
                    paintMode(s.mode);
                  } catch (e) {}
                }, 500);
                // The mode is chosen by the URL, not a tab: /vulnerable or /hardened.
                const MODE = location.pathname.replace(/\/+$/, '').endsWith('/hardened') ? 'hardened' : 'vulnerable';

                const paintMode = m => {
                  document.body.classList.toggle('hardened', m === 'hardened');
                  mode.hidden = false;
                  mode.textContent = m;
                  mode.className = 'mode ' + m;
                };

                // Set the backend mode for this page (plants the credentials and protections)
                // and restore the data, so the page always opens from a clean starting point.
                const setMode = async m => {
                  try {
                    await fetch('/mode', {method: 'POST', headers: {'content-type': 'application/json'},
                                          body: JSON.stringify({mode: m})});
                  } catch (e) {}
                  paintMode(m);
                };

                paintMode(MODE);
                setMode(MODE);

                let started = false;          // has this conversation been opened yet

                const send = async fresh => {
                  const text = promptBox.value.trim();
                  if (!text) return;
                  runBtn.disabled = true;
                  runBtn.textContent = 'Working…';
                  try {
                    const r = await (await fetch('/run', {
                      method: 'POST', headers: {'content-type': 'application/json'},
                      body: JSON.stringify({prompt: text, fresh: fresh})
                    })).json();
                    if (r.error) alert(r.error); else started = true;
                  } catch (e) {}
                  promptBox.value = '';
                  promptBox.placeholder = 'Reply to the agent, or approve';
                  setTimeout(() => { runBtn.disabled = false; runBtn.textContent = 'Send to agent'; }, 3000);
                };

                runBtn.addEventListener('click', () => send(!started));

                newBtn.addEventListener('click', async () => {
                  await fetch('/reset', {method: 'POST'});
                  started = false;
                  promptBox.value = "Can you check why customers can't log in to staging?";
                  promptBox.placeholder = '';
                });

                // cmd or ctrl enter sends, so you are not hunting for the button on stage
                promptBox.addEventListener('keydown', e => {
                  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runBtn.click(); }
                });

                seedBtn.addEventListener('click', async () => {
                  seedBtn.disabled = true;
                  seedBtn.textContent = 'Seeding…';
                  try {
                    const r = await (await fetch('/seed', {method: 'POST'})).json();
                    if (r.error) alert(r.error);
                  } catch (e) {}
                  seedBtn.disabled = false;
                  seedBtn.textContent = 'Reseed data';
                });

                // Track a byte offset, not an array length. The endpoint used to cap at 40, so
                // once the log passed 40 lines the length never changed and nothing ever showed.
                let falcoAt = null;
                setInterval(async () => {
                  try {
                    const r = await (await fetch('/falco?since=' + (falcoAt === null ? 0 : falcoAt))).json();
                    if (falcoAt === null) { falcoAt = r.total; return; }   // ignore history on load
                    r.alerts.forEach(a => put('falcoPane', a.text, a.pri === 'Critical' ? 'deny' : 'warn'));
                    falcoAt = r.total;
                  } catch (e) {}
                }, 1500);
                </script>
