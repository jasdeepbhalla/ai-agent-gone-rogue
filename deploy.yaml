                @app.get("/falco")
                def http_falco():
                    """Alerts since a given offset, so the dashboard never loses one to a window."""
                    since = request.args.get("since", type=int, default=0)
                    out = []
                    try:
                        lines = open("/var/log/falco/falco.jsonl").read().splitlines()
                    except Exception:
                        lines = []
                    for raw in lines[since:]:
                        if not raw.strip():
                            continue
                        try:
                            d = json.loads(raw)
                        except Exception:
                            continue
                        text = d.get("output", "")
                        if ":" in text[:16]:                      # strip the leading timestamp
                            text = text.split(": ", 1)[-1]
                        for noise in ("Warning ", "Critical ", "Notice ", "Error "):
                            text = text.replace(noise, "", 1)
                        text = re.split(r"\s+container_id=", text)[0].strip()[:90]
                        if out and out[-1]["text"] == text:      # one exec spawns several events
                            continue
                        out.append({"pri": d.get("priority", ""), "text": text})
                    return jsonify(total=len(lines), alerts=out[-60:])


