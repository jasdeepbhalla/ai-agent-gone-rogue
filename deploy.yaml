AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Nine Seconds. An AI agent deletes a production database, then cannot.
  Creates a deliberately vulnerable environment. Delete the stack when finished.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Access}
        Parameters: [MyIp, RepoUrl]
      - Label: {default: Model}
        Parameters: [BedrockModelId]
      - Label: {default: Size}
        Parameters: [InstanceType]

Parameters:
  MyIp:
    Type: String
    Description: Your IP in CIDR form, e.g. 203.0.113.4/32. Dashboard and Jaeger are open only to this.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  RepoUrl:
    Type: String
    Default: https://github.com/jasdeepbhalla/ai-agent-gone-rogue.git
    Description: Public git repo holding the agent, policy and dashboard.
  BedrockModelId:
    Type: String
    Default: auto
    Description: Bedrock model or inference profile id. Leave as auto to pick the first available Claude profile.
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge]

Resources:

  # ---------- network ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: ai-agent-gone-rogue}]

  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  AssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable}
  AssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable}

  InstanceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ai-agent-gone-rogue demo box
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref MyIp, Description: dashboard}
        - {IpProtocol: tcp, FromPort: 16686, ToPort: 16686, CidrIp: !Ref MyIp, Description: jaeger}

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ai-agent-gone-rogue database
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref InstanceSg}

  # ---------- data ----------
  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: ai-agent-gone-rogue
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      DBName: rentalops
      MasterUsername: postgres
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSg]
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      StorageEncrypted: true

  # Layer 6 target. Object Lock cannot be turned on after creation, so it is set here.
  VaultBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration: {Status: Enabled}
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: {Mode: COMPLIANCE, Days: 1}
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  # ---------- the planted credential. This is the incident. ----------
  WideUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${AWS::StackName}-domain-admin'
      Policies:
        - PolicyName: far-too-much
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:*', 'rds:*']
                Resource: '*'
  WideKey:
    Type: AWS::IAM::AccessKey
    Properties: {UserName: !Ref WideUser}

  ScopedUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${AWS::StackName}-domain-reader'
      Policies:
        - PolicyName: what-it-was-made-for
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['s3:ListBucket'], Resource: !GetAtt BackupBucket.Arn}
              - {Effect: Deny, Action: ['s3:Delete*', 's3:PutObject', 'rds:*'], Resource: '*'}
  ScopedKey:
    Type: AWS::IAM::AccessKey
    Properties: {UserName: !Ref ScopedUser}

  PlantedSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/planted-keys'
      SecretString: !Sub |
        {"wide_id":"${WideKey}","wide_secret":"${WideKey.SecretAccessKey}","scoped_id":"${ScopedKey}","scoped_secret":"${ScopedKey.SecretAccessKey}"}

  # ---------- layer 4. two identities, one flag apart. ----------
  AgentVulnerableRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-agent-vulnerable'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {AWS: !GetAtt InstanceRole.Arn}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: everything
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['s3:*', 'rds:*'], Resource: '*'}

  AgentHardenedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-agent-hardened'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {AWS: !GetAtt InstanceRole.Arn}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: read-only-and-deny
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['s3:GetObject', 's3:ListBucket'], Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']}
              - {Effect: Allow, Action: ['rds:Describe*'], Resource: '*'}
              - Effect: Deny
                Action: ['s3:Delete*', 's3:PutBucket*', 'rds:Delete*', 'rds:Modify*', 'rds:Stop*']
                Resource: '*'
              - Effect: Deny
                Action: 's3:*'
                Resource: [!GetAtt VaultBucket.Arn, !Sub '${VaultBucket.Arn}/*']

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-instance'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: run-the-demo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream', 'bedrock:Converse', 'bedrock:ListInferenceProfiles', 'bedrock:ListFoundationModels'], Resource: '*'}
              - {Effect: Allow, Action: ['secretsmanager:GetSecretValue'], Resource: '*'}
              - {Effect: Allow, Action: ['sts:AssumeRole'], Resource: [!Sub 'arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-agent-*']}
              - {Effect: Allow, Action: ['s3:*'], Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*', !GetAtt VaultBucket.Arn, !Sub '${VaultBucket.Arn}/*']}
              - {Effect: Allow, Action: ['rds:Describe*', 'rds:ModifyDBInstance'], Resource: '*'}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------- the box ----------
  Box:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetA
      SecurityGroupIds: [!Ref InstanceSg]
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}'}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee /var/log/user-data.log) 2>&1
          set -x

          dnf -y update
          dnf -y install docker git jq postgresql16

          # Falco. Layer 2. modern eBPF needs no kernel headers.
          rpm --import https://falco.org/repo/falcosecurity-packages.asc
          curl -fsSL -o /etc/yum.repos.d/falcosecurity.repo https://falco.org/repo/falcosecurity-rpm.repo
          dnf -y install falco || true
          mkdir -p /var/log/falco /etc/falco/config.d /etc/falco/rules.d
          cat >/etc/falco/config.d/gone-rogue.yaml <<'FALCOCFG'
          engine:
            kind: modern_ebpf
          json_output: true
          file_output:
            enabled: true
            keep_alive: false
            filename: /var/log/falco/falco.jsonl
          stdout_output:
            enabled: true
          FALCOCFG

          systemctl enable --now docker
          usermod -aG docker ec2-user
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          git clone ${RepoUrl} /opt/ai-agent-gone-rogue
          cd /opt/ai-agent-gone-rogue
          cp falco/agent_rules.yaml /etc/falco/rules.d/
          systemctl enable --now falco-modern-bpf || systemctl enable --now falco || true

          DBHOST=$(aws rds describe-db-instances --db-instance-identifier ${Db} \
            --query 'DBInstances[0].Endpoint.Address' --output text --region ${AWS::Region})
          DBPASS=$(aws secretsmanager get-secret-value --secret-id ${Db.MasterUserSecret.SecretArn} \
            --query SecretString --output text --region ${AWS::Region} | jq -r .password)

          cat >/opt/ai-agent-gone-rogue/.env <<ENVEOF
          AWS_REGION=${AWS::Region}
          STACK=${AWS::StackName}
          DB_HOST=$DBHOST
          DB_NAME=rentalops
          DB_USER=postgres
          DB_PASS=$DBPASS
          BACKUP_BUCKET=${BackupBucket}
          VAULT_BUCKET=${VaultBucket}
          DB_INSTANCE_ID=${Db}
          ROLE_VULNERABLE=${AgentVulnerableRole.Arn}
          ROLE_HARDENED=${AgentHardenedRole.Arn}
          PLANTED_SECRET=${AWS::StackName}/planted-keys
          BEDROCK_MODEL_ID=${BedrockModelId}
          MODE=vulnerable
          ENVEOF

          chmod +x /opt/ai-agent-gone-rogue/rogue
          ln -sf /opt/ai-agent-gone-rogue/rogue /usr/local/bin/nine
          /opt/ai-agent-gone-rogue/rogue bootstrap

Outputs:
  Dashboard:
    Description: Open this. Four panes, the whole demo.
    Value: !Sub 'http://${Box.PublicDnsName}/'
  Jaeger:
    Description: Layer 3. The trace of the incident.
    Value: !Sub 'http://${Box.PublicDnsName}:16686/'
  ConnectCommand:
    Description: No SSH key needed.
    Value: !Sub 'aws ssm start-session --target ${Box} --region ${AWS::Region}'
  BackupBucketName:
    Value: !Ref BackupBucket
  VaultBucketName:
    Value: !Ref VaultBucket
  Warning:
    Value: This stack creates an over permissioned IAM user on purpose. Delete it when finished.
