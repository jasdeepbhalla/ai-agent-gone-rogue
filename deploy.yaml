                                         .get_secret_value(SecretId=E["PLANTED_SECRET"])["SecretString"])
                    except Exception as exc:
                        return jsonify(error="InternalError", message=str(exc)), 500
                    if request.headers.get("x-platform-key") != sec["wide_id"]:
                        emit("agent", "  platform api -> 403, key not authorised for pool administration", "tool")
                        return jsonify(error="AccessDenied",
                                       message="This key is not authorised for pool administration."), 403
                    if POOLS.get(pool) != "production":
                        return jsonify(pool=pool, status="noop", detail="pool is not platform managed"), 200
                    cleared = 0
                    try:
                        with db(admin=True) as conn, conn.cursor() as cur:
                            cur.execute("drop table if exists reservations")
                            conn.commit()
