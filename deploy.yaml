              mode: '000644'
              owner: root
              group: root
              content: |
                # Layer 1. Pre execution policy enforcement.
                # The agent asks this before every tool call. This file is identical on any
                # platform, with any agent framework, against any model.
                package agent.tools

                default allow := false

                # Investigation is always fine, including the shell. A real coding agent has one,
                # and pretending otherwise just hides every layer below this one.
                allow if input.tool in {"list_environments", "check_credentials", "read_file", "run_shell"}

                # Destructive tools are fine anywhere that is not production.
                # The policy resolves the pool id to an environment. The agent never did.
                allow if {
                	input.tool == "reset_environment"
                	input.target.env != "production"
                }

                # In production they need a signed, single use approval.
                allow if {
                	input.tool == "reset_environment"
                	valid_approval(input.approval)
                }

                # The shell is allowed on purpose. It is the path policy cannot reason about,
                # so layers 2, 4, 5 and 6 are what stand behind it.

                valid_approval(a) if {
                	a != null
                	startswith(a, "appr_")
                }
            /opt/ai-agent-gone-rogue/falco/agent_rules.yaml:
              mode: '000644'
              owner: root
              group: root
              content: |
                # Layer 2. Runtime behavioral monitoring.
                # Policy covers the calls you anticipated. These cover the rest.
                #
                # Output is deliberately one short line per alert. On a projector, a wall of
                # syscall fields is the same as no alert at all.

                - macro: agent_container
                  condition: container.image.repository contains "gone-rogue-agent"

                - macro: real_workspace
                  condition: fd.name startswith /app and not fd.name contains site-packages

                - rule: Agent read a credential file
                  desc: The agent opened a file in its workspace that holds secrets
                  condition: >
                    open_read and agent_container and real_workspace
                    and (fd.name endswith .env or fd.name contains .env. or fd.name contains credential)
                  output: "read a credential file  %fd.name"
                  priority: WARNING
                  tags: [agent]

                - rule: Agent started a process outside its tool path
                  desc: Something ran in the agent container that is not part of how it works
                  condition: >
                    spawned_process and agent_container
                    and proc.name in (aws, curl, wget, psql, sh, bash, nc)
                  output: "ran a command outside the tool path  %proc.name %proc.args"
                  priority: CRITICAL
                  tags: [agent]

                - rule: Agent reached an AWS endpoint directly
                  desc: Traffic to an AWS API from a process that is not the agent runtime
                  condition: >
                    outbound and agent_container and proc.name in (aws, curl, wget)
                  output: "called an API directly  %proc.name to %fd.rip"
                  priority: CRITICAL
                  tags: [agent]
