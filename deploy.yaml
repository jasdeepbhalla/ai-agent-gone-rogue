                                           aws_secret_access_key=c["PLATFORM_SECRET_ACCESS_KEY"],
                                           region_name=REGION).client("s3")
                        objs = s3.list_objects_v2(Bucket=BACKUP_BUCKET, Prefix="daily/").get("Contents", [])
                        if objs:
