                header{display:flex;gap:18px;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line)}
                header b{font-size:15px;letter-spacing:.04em}
                header .mode{color:var(--bad);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
                header .mode.hardened{color:var(--ok)}
                .grid{flex:1;display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1.7fr 1fr;gap:1px;background:var(--line);min-height:0}
                section{background:var(--pane);padding:10px 14px;overflow:auto;min-height:0}
                h2{margin:0 0 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--pane);padding-bottom:6px}
                .line{white-space:pre-wrap;word-break:break-word;margin:2px 0;color:#CBD6D4}
                .line.tool{color:var(--ok)}
                .line.meta{color:#5D6C6A}
                .line.allow{color:var(--ok)}
                .line.deny{color:var(--bad);font-weight:600}
                .line.warn{color:var(--warn)}
                .line b{color:var(--ink);font-weight:700}
